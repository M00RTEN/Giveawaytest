<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Giveaway System</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --p: #9146ff; 
            --a: #00f2ff; 
            --bg: #0e0e10; 
        }

        body { 
            background: transparent; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* ADMIN PANEL - Kan beskjæres bort i OBS */
        .admin-panel {
            background: #18181b; 
            padding: 30px; 
            border-radius: 20px; 
            border: 2px solid var(--p); 
            max-width: 350px; 
            width: 100%; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            z-index: 10;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        h1 { font-size: 1.5rem; margin-top: 0; color: #fff; }
        .stats { font-size: 3rem; font-weight: 900; color: var(--a); margin: 10px 0; text-align: center; }
        input { width: 100%; padding: 10px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; margin: 10px 0; text-align: center; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--a); }
        .btn { background: var(--p); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; text-transform: uppercase; }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }

        /* STREAM OVERLAY - Seernes visning */
        #stream-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0); 
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .winner-box {
            background: linear-gradient(135deg, rgba(24, 24, 27, 0.98), rgba(14, 14, 16, 0.98));
            padding: 60px 100px;
            border-radius: 50px;
            border: 4px solid var(--a);
            box-shadow: 0 0 60px rgba(145, 70, 255, 0.5);
            text-align: center;
            animation: winnerPop 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.49) forwards;
        }

        .winner-title {
            text-transform: uppercase;
            letter-spacing: 12px;
            color: var(--p);
            font-weight: 900;
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(145, 70, 255, 0.6);
        }

        #winner-name {
            font-size: 6rem;
            margin: 0;
            color: #fff;
            text-shadow: 0 0 25px var(--a);
            font-weight: 900;
        }

        @keyframes winnerPop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #debug { 
            background: #000; color: #444; padding: 8px; height: 60px; 
            overflow-y: auto; text-align: left; font-size: 10px; 
            margin-top: 10px; border-radius: 5px; font-family: monospace; 
        }
    </style>
</head>
<body>

    <!-- KONTROLLPANEL -->
    <div id="login-screen" class="admin-panel">
        <h1>Giveaway System</h1>
        <p style="font-size: 0.9rem; color: #888;">Koble til din Twitch-chat</p>
        <button class="btn" onclick="login()">Koble til Twitch</button>
    </div>

    <div id="app" style="display:none;" class="admin-panel">
        <div id="chan-name" style="font-size: 0.8rem; color: var(--p); font-weight: bold; letter-spacing: 1px;"></div>
        <input type="text" id="cmd" value="!join">
        <div class="stats" id="count">0</div>
        <button class="btn" onclick="draw()">Trekk & Vis Vinner</button>
        <div id="debug"></div>
    </div>

    <!-- STREAM OVERLAY -->
    <div id="stream-overlay">
        <div class="winner-box">
            <div class="winner-title">Vinneren er</div>
            <h1 id="winner-name">?</h1>
        </div>
    </div>

    <script>
        // CLIENT_ID må samsvare med din app i Twitch Developer Console
        const CLIENT_ID = "amd8hpskhqo4pqchmhdvis0j7gbes7"; 
        const REDIRECT_URI = window.location.origin + window.location.pathname; 
        
        let socket, pool = [], participants = new Set(), channelName = "";

        const dbg = (msg) => {
            const d = document.getElementById('debug');
            if(d) {
                d.innerHTML += `> ${msg}<br>`;
                d.scrollTop = d.scrollHeight;
            }
        };

        function login() {
            const scopes = encodeURIComponent("chat:read chat:edit");
            window.location.href = `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${scopes}`;
        }

        const hash = window.location.hash;
        if (hash) {
            const params = new URLSearchParams(hash.replace("#", "?"));
            const token = params.get("access_token");
            if (token) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                
                fetch('https://api.twitch.tv/helix/users', {
                    headers: { 'Authorization': `Bearer ${token}`, 'Client-Id': CLIENT_ID }
                })
                .then(r => r.json())
                .then(data => {
                    channelName = data.data[0].login;
                    document.getElementById('chan-name').innerText = channelName.toUpperCase();
                    connectToChat(channelName, token);
                })
                .catch(err => dbg("Feil ved henting av bruker: " + err));
            }
        }

        function connectToChat(chan, tok) {
            socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

            socket.onopen = () => {
                socket.send(`PASS oauth:${tok}`);
                socket.send(`NICK ${chan}`);
                socket.send(`JOIN #${chan}`);
                dbg("Bot tilkoblet chat!");
            };

            socket.onmessage = (event) => {
                const raw = event.data;
                if (raw.includes('PING')) return socket.send('PONG :tmi.twitch.tv');

                if (raw.includes('PRIVMSG')) {
                    const parts = raw.split('!');
                    const user = parts[0].substring(1);
                    const msgPart = raw.split('PRIVMSG')[1];
                    const msg = msgPart.split(':')[1].trim().toLowerCase();
                    const trigger = document.getElementById('cmd').value.trim().toLowerCase();

                    if (msg === trigger && !participants.has(user)) {
                        participants.add(user);
                        pool.push(user);
                        document.getElementById('count').innerText = participants.size;
                        dbg(`${user} ble med`);
                    }
                }
            };
        }

        function draw() {
            if (pool.length === 0) return alert("Ingen deltakere har brukt kommandoen ennå!");
            
            const winner = pool[Math.floor(Math.random() * pool.length)];
            
            // Aktiver overlay
            const overlay = document.getElementById('stream-overlay');
            document.getElementById('winner-name').innerText = winner;
            overlay.style.display = 'flex';

            // Konfetti
            confetti({
                particleCount: 250,
                spread: 90,
                origin: { y: 0.6 },
                colors: ['#9146ff', '#00f2ff', '#ffffff']
            });

            // Send automatisk melding til chat
            if (socket && socket.readyState === WebSocket.OPEN) {
                const chatMsg = `PRIVMSG #${channelName} :🎉 Gratulerer @${winner}! Du vant giveawayen! 🎉`;
                socket.send(chatMsg);
                dbg("Vinner-melding sendt til chat.");
            }

            // Skjul overlay automatisk etter 10 sekunder
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 10000);
        }
    </script>
</body>
</html>
