<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Giveaway System</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --p: #9146ff; 
            --a: #00f2ff; 
            --bg: #0e0e10; 
        }

        body { 
            background: transparent; /* Viktig for OBS */
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* ADMIN PANEL - Skal ikke synes i OBS hvis du beskjærer kilden */
        .admin-panel {
            background: #18181b; 
            padding: 30px; 
            border-radius: 20px; 
            border: 2px solid var(--p); 
            max-width: 350px; 
            width: 100%; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            z-index: 10;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .stats { font-size: 3rem; font-weight: 900; color: var(--a); margin: 10px 0; text-align: center; }
        input { width: 100%; padding: 10px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; margin: 10px 0; text-align: center; box-sizing: border-box; }
        .btn { background: var(--p); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn:hover { filter: brightness(1.2); }

        /* STREAM OVERLAY - Dette er det seerne ser */
        #stream-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0); /* Gjennomsiktig bakgrunn */
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .winner-box {
            background: linear-gradient(135deg, rgba(24, 24, 27, 0.95), rgba(14, 14, 16, 0.98));
            padding: 60px 100px;
            border-radius: 50px;
            border: 4px solid var(--a);
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.4);
            text-align: center;
            animation: winnerPop 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.49) forwards;
        }

        .winner-title {
            text-transform: uppercase;
            letter-spacing: 12px;
            color: var(--p);
            font-weight: 900;
            font-size: 1.5rem;
            margin-bottom: 20px;
            animation: glowText 2s infinite alternate;
        }

        #winner-name {
            font-size: 6rem;
            margin: 0;
            color: #fff;
            text-shadow: 0 0 20px var(--a);
        }

        @keyframes winnerPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes glowText {
            from { text-shadow: 0 0 5px var(--p); }
            to { text-shadow: 0 0 20px var(--p), 0 0 30px var(--a); }
        }
    </style>
</head>
<body>

    <!-- KONTROLLPANEL (Flytt denne ut av bildet i OBS eller bruk Window Capture) -->
    <div id="login-screen" class="admin-panel">
        <h2 style="margin:0 0 10px 0;">Giveaway</h2>
        <button class="btn" onclick="login()">KOBLE TIL TWITCH</button>
    </div>

    <div id="app" style="display:none;" class="admin-panel">
        <div id="chan-name" style="font-size: 0.8rem; color: var(--p); font-weight: bold;"></div>
        <input type="text" id="cmd" value="!join">
        <div class="stats" id="count">0</div>
        <button class="btn" onclick="draw()">TREKK & VIS OVERLAY</button>
    </div>

    <!-- STREAM OVERLAY (Dette er det du ser i OBS) -->
    <div id="stream-overlay">
        <div class="winner-box">
            <div class="winner-title">VINNEREN ER</div>
            <h1 id="winner-name">?</h1>
        </div>
    </div>

    <script>
        const CLIENT_ID = "amd8hpskhqo4pqchmhdvis0j7gbes7"; 
        const REDIRECT_URI = window.location.origin + window.location.pathname; 
        let socket, pool = [], participants = new Set(), channelName = "";

        function login() {
            const scopes = encodeURIComponent("chat:read chat:edit");
            window.location.href = `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${scopes}`;
        }

        const hash = window.location.hash;
        if (hash) {
            const params = new URLSearchParams(hash.replace("#", "?"));
            const token = params.get("access_token");
            if (token) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                fetch('https://api.twitch.tv/helix/users', {
                    headers: { 'Authorization': `Bearer ${token}`, 'Client-Id': CLIENT_ID }
                }).then(r => r.json()).then(data => {
                    channelName = data.data[0].login;
                    document.getElementById('chan-name').innerText = channelName.toUpperCase();
                    connectToChat(channelName, token);
                });
            }
        }

        function connectToChat(chan, tok) {
            socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
            socket.onopen = () => {
                socket.send(`PASS oauth:${tok}`);
                socket.send(`NICK ${chan}`);
                socket.send(`JOIN #${chan}`);
            };
            socket.onmessage = (event) => {
                const raw = event.data;
                if (raw.includes('PING')) return socket.send('PONG :tmi.twitch.tv');
                if (raw.includes('PRIVMSG')) {
                    const user = raw.split('!')[0].substring(1);
                    const msg = raw.split('PRIVMSG')[1].split(':')[1].trim().toLowerCase();
                    const trigger = document.getElementById('cmd').value.trim().toLowerCase();
                    if (msg === trigger && !participants.has(user)) {
                        participants.add(user);
                        pool.push(user);
                        document.getElementById('count').innerText = participants.size;
                    }
                }
            };
        }

        function draw() {
            if (pool.length === 0) return alert("Ingen deltakere!");
            const winner = pool[Math.floor(Math.random() * pool.length)];
            
            // Aktiver overlay
            const overlay = document.getElementById('stream-overlay');
            document.getElementById('winner-name').innerText = winner;
            overlay.style.display = 'flex';

            // Effekt
            confetti({ particleCount: 300, spread: 100, origin: { y: 0.6 } });

            // Bot-melding
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(`PRIVMSG #${channelName} :🎉 Gratulerer @${winner}! Du vant giveawayen! 🎉`);
            }

            // Skjul overlay automatisk etter 10 sekunder
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 10000);
        }
    </script>
</body>
</html>
